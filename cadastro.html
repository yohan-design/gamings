<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Projetos - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-box">
        <div class="logo-container" style="margin-bottom: 25px;">
            <img src="logo.png" alt="Colégio Progresso" class="logo-topo">
        </div>

        <h1>Criar Conta</h1>
        <p>Cadastre-se para iniciar sua jornada do zero XP.</p>

        <input type="text" id="novoUsuario" placeholder="Escolha um Nome de Usuário" autocomplete="off">
        <input type="password" id="novaSenha" placeholder="Crie uma Senha">

        <button onclick="cadastrar()">Finalizar Cadastro</button>

        <a href="login.html">Já tem registro? Faça o login</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
