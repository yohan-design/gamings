<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Projetos - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-box">
        <div class="logo-container" style="margin-bottom: 25px;">
            <img src="logo.png" alt="Colégio Progresso" class="logo-topo">
        </div>

        <h1>Acessar Hub</h1>
        <p>Insira suas credenciais para acompanhar seu nível e jogar.</p>

        <input type="text" id="usuario" placeholder="Nome do Aluno" autocomplete="off">
        <input type="password" id="senha" placeholder="Sua Senha">

        <button onclick="entrar()">Entrar no Portal</button>

        <a href="cadastro.html">Não tem uma conta? Crie uma aqui</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
